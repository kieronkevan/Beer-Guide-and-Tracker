name: Sync Notion data and deploy

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 6am UTC — adjust as you like
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BEERS_DS: ${{ secrets.NOTION_BEERS_DS }}
          NOTION_COUNTRIES_DS: ${{ secrets.NOTION_COUNTRIES_DS }}
          NOTION_BREWERIES_DS: ${{ secrets.NOTION_BREWERIES_DS }}
          NOTION_STYLES_DS: ${{ secrets.NOTION_STYLES_DS }}
        run: node scripts/sync-notion.js

      - name: Commit updated data
        run: |
          git config user.name "beer-guide-bot"
          git config user.email "actions@github.com"
          git add docs/data.json docs/images
          git diff --quiet --cached || git commit -m "Sync beer data from Notion"
          git push